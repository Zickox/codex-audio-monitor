name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]

jobs:
  docs-hygiene:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on local absolute paths in public docs
        run: |
          set -euo pipefail
          if rg -n '/Users/' README.md docs CHANGELOG.md; then
            echo "Found local absolute paths in public docs"
            exit 1
          fi

      - name: Fail on obvious sensitive tokens in public docs
        run: |
          set -euo pipefail
          if rg -n 'gho_|keyring|cencosud' README.md docs CHANGELOG.md; then
            echo "Found sensitive/company references in public docs"
            exit 1
          fi

  macos-build:
    runs-on: macos-15
    needs: [docs-hygiene]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode build (Debug)
        run: xcodebuild -project CodexAudioMonitor.xcodeproj -scheme CodexAudioMonitorApp -configuration Debug -destination 'platform=macOS' build

      - name: Xcode build (Release)
        run: xcodebuild -project CodexAudioMonitor.xcodeproj -scheme CodexAudioMonitorApp -configuration Release -destination 'platform=macOS' build

  macos-unit-tests:
    runs-on: macos-15
    needs: [docs-hygiene]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode unit tests (live tests remain opt-in)
        run: |
          xcodebuild \
            -project CodexAudioMonitor.xcodeproj \
            -scheme CodexAudioMonitorApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath .artifacts/unit-tests.xcresult \
            test

      - name: Upload unit test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-audio-monitor-unit-tests
          path: .artifacts/unit-tests.xcresult
