name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Xcode app scheme (Release)
        run: |
          xcodebuild \
            -project CodexAudioMonitor.xcodeproj \
            -scheme CodexAudioMonitorApp \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .DerivedData \
            build

      - name: Validate unit tests before packaging
        run: |
          xcodebuild \
            -project CodexAudioMonitor.xcodeproj \
            -scheme CodexAudioMonitorApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            test

      - name: Package unsigned app bundle
        run: |
          set -euo pipefail
          APP_PATH=".DerivedData/Build/Products/Release/CodexAudioMonitor.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Release app bundle not found at $APP_PATH"
            exit 1
          fi

          mkdir -p dist
          cp -R "$APP_PATH" dist/CodexAudioMonitor.app
          tar -czf dist/CodexAudioMonitor-macos-unsigned.tar.gz -C dist CodexAudioMonitor.app
          shasum -a 256 dist/CodexAudioMonitor-macos-unsigned.tar.gz > dist/CodexAudioMonitor-macos-unsigned.tar.gz.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-audio-monitor-release
          path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodexAudioMonitor-macos-unsigned.tar.gz
            dist/CodexAudioMonitor-macos-unsigned.tar.gz.sha256
